; StickS3 (K150) · clawd 终端固件
; 官方 PlatformIO 配置见 skill reference/toolchain.md，此处按我们的需要加了自定义分区表。
[env:m5stack-sticks3]
; 官方 M5Stack 文档给 StickS3 的配置就是 espressif32@6.12.0（skill reference/toolchain.md）。
; 曾试过平台自带的 7.1.3：它要多下一个 ~250MB 的新工具链 + 大体积 framework，且下载反复重试，
; 在 1.1GB 处仍未完成，故按官方口径钉住 6.12.0。
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; 8MB Octal PSRAM：写错拿不到 PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
; USB-Serial/JTAG core reset can retain the ROM download-mode flag.
; A full watchdog reset reliably boots the application after upload.
board_upload.after_reset = watchdog_reset
; 我们自己的 A/B 分区表（见 partitions.csv），覆盖默认的 default_8MB.csv
board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DCLAWD_FW_VER=\"v0.4.38\"

lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#8b63555e7bd9ac71978c55ad868fd1d1d3b2ef3e
    m5stack/M5GFX@0.2.32
