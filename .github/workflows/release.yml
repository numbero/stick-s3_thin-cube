name: Release

on:
  push:
    tags: ['v*']
  # Build and verify signed downloads without publishing a Release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY_SHA1: ${{ vars.MACOS_SIGNING_IDENTITY_SHA1 }}
        run: |
          for task_name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY_SHA1; do
            if [ -z "${!task_name}" ]; then
              echo "::error::Missing signing configuration: $task_name. See docs/github-actions-release.md."
              exit 1
            fi
          done
      - name: Validate release source and versions
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$EVENT_NAME" = push ] || [ "$REF_TYPE" = tag ]; then
            python3 scripts/release.py validate --tag "$REF_NAME" --main-ref origin/main --github-output "$GITHUB_OUTPUT"
          else
            git merge-base --is-ancestor HEAD origin/main
            python3 scripts/release.py validate --github-output "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      signed: true
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-firmware
          path: artifacts/release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-macos
          path: artifacts/release
      - name: Verify and assemble release
        run: python3 scripts/release.py assemble --directory artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-downloads
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Publish complete release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --directory artifacts/release
